name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        env:
          # Set these in Settings → Secrets and variables → Actions.
          API_URL: ${{ secrets.API_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL secret is not set — the app would build with no backend."
            exit 1
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
